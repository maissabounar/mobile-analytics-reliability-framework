event_name: claim_submitted
version: "2.0"
priority: P0
category: conversion
owner: Product - Claim Flow Team
updated: "2025-10-01"

description: >
  Fired when a user successfully submits a claim and the backend confirms receipt.
  This is the source of truth for claim submission volume in dashboards, funnel
  reporting, and OKR tracking.

trigger:
  when: API response returns HTTP 202 from /api/v2/claims/submit
  not_when:
    - User taps the submit button
    - API returns 4xx or 5xx
    - Claim is saved as draft
    - User retries after a successful submission
  notes: >
    The event must fire after backend confirmation, not on button click.
    Use claim_id to prevent duplicate events caused by retries, double taps,
    or activity recreation.

parameters:
  required:
    - name: claim_id
      type: string
      source: API response body - claim.id
      example: "clm_9f3a21bc"
      notes: Server-generated ID. Never generated client-side.

    - name: claim_type
      type: string
      allowed_values:
        - property
        - vehicle
        - health
        - travel
      example: "property"

    - name: has_documents
      type: string
      allowed_values:
        - "true"
        - "false"
      example: "true"
      notes: Stored as string because Firebase does not support native booleans.

    - name: user_id
      type: string
      source: Authentication state
      example: "usr_8f3a2c"
      notes: Must be available before the event fires.

    - name: app_version
      type: string
      example: "4.13.2"

  optional:
    - name: step_count
      type: integer
      description: Number of steps completed before submission.
      example: 4

    - name: time_to_submit_seconds
      type: integer
      description: Seconds between claim_started and claim_submitted in the same session.
      example: 347

platform_implementation:
  ios:
    location: ClaimSubmissionViewModel.swift - submitClaim() completion handler
    verified: true
    version_implemented: "4.12"
    notes: >
      Event fires only inside the success callback after the claim API confirms receipt.

  android:
    location: ClaimSubmissionViewModel.kt - submitClaim() observer
    verified: true
    version_implemented: "4.12"
    notes: >
      Previous implementation fired on button click. It was moved to the ViewModel
      success observer in v4.12 to prevent duplicate submissions and false conversions.

qa_rules:
  - rule: Event fires exactly once per successful claim submission
    method: DebugView test with one completed submission
    fail_condition: Zero events or more than one event for the same claim_id

  - rule: claim_id is populated
    method: BigQuery validation
    fail_condition: claim_id IS NULL or claim_id = ""

  - rule: Event does not fire on API error
    method: DebugView test with forced 4xx or 5xx response
    fail_condition: claim_submitted fires after an error response

  - rule: user_id is populated
    method: BigQuery validation
    fail_condition: user_id IS NULL or user_id = ""

  - rule: Event fires after backend confirmation
    method: Charles Proxy or API log comparison
    fail_condition: Event timestamp is earlier than the API success response

bigquery_notes: >
  Deduplicated in fct_claim_conversions using claim_id as the business key.
  Deprecated event submit_claim remains in the transition mapping until v5.0.
  Any P0 anomaly in daily claim_submitted volume triggers an alert to #data-alerts.
