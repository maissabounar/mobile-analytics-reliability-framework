event_name: payment_completed
version: "2.1"
priority: P0
category: revenue
owner: Sales Operations + Mobile Engineering
updated: "2025-10-01"

description: >
  Fired when a payment is confirmed and the transaction ID is available.
  This event is the source of truth for in-app revenue reporting and payment
  reconciliation.

trigger:
  when: >
    Payment provider confirms success and the app receives a valid transaction_id.
    The event fires from the payment confirmation handler, not from the payment UI.
  not_when:
    - Payment screen loads
    - User selects a payment method
    - Payment is pending or processing
    - Payment fails
  notes: >
    transaction_id must come from the server response or payment provider response.
    Do not generate it client-side. If transaction_id is missing, do not fire
    payment_completed.

parameters:
  required:
    - name: transaction_id
      type: string
      source: Payment provider response
      example: "pi_3Oab12CZ6"
      notes: Required for reconciliation and deduplication.

    - name: amount
      type: float
      unit: major currency units
      example: 49.99
      notes: Send 49.99, not 4999.

    - name: currency
      type: string
      example: "EUR"
      notes: ISO 4217 currency code.

    - name: payment_method
      type: string
      allowed_values:
        - card
        - sepa_debit
        - apple_pay
        - google_pay
      example: "card"

    - name: user_id
      type: string
      source: Authentication state
      example: "usr_8f3a2c"
      notes: Must be available before the event fires.

    - name: claim_id
      type: string
      source: Current claim context
      example: "clm_9f3a21bc"
      notes: Links the payment to the submitted claim.

  optional:
    - name: is_retry
      type: string
      allowed_values:
        - "true"
        - "false"
      description: Whether the payment succeeded after a previous failure in the same session.

    - name: installment_index
      type: integer
      description: Installment number for payment plans.
      example: 2

platform_implementation:
  ios:
    location: PaymentConfirmationViewController.swift - handlePaymentResult()
    verified: true
    version_implemented: "4.13"
    notes: >
      Event fires only after payment confirmation and only when transaction_id
      is available.

  android:
    location: PaymentViewModel.kt - observePaymentResult()
    verified: true
    version_implemented: "4.13"
    notes: >
      Event moved to the ViewModel payment result observer to reduce event loss
      during activity recreation. transaction_id is checked before the event fires.

qa_rules:
  - rule: transaction_id is populated
    method: BigQuery validation
    fail_condition: transaction_id IS NULL or transaction_id = ""

  - rule: No duplicate payment_completed event for the same transaction_id
    method: BigQuery duplicate check
    fail_condition: Same transaction_id appears more than once

  - rule: Event fires after payment confirmation
    method: API log or proxy comparison
    fail_condition: Event timestamp is earlier than the payment success timestamp

  - rule: payment_completed does not fire on failed or pending payments
    method: DebugView test with failed and pending payment scenarios
    fail_condition: payment_completed fires without confirmed payment success

  - rule: payment_completed and payment_failed are mutually exclusive
    method: BigQuery validation
    fail_condition: Same transaction_id has both payment_completed and payment_failed

  - rule: Daily analytics revenue stays within reconciliation tolerance
    method: BigQuery revenue check against payment reconciliation export
    fail_condition: Revenue gap exceeds 2% for 3 consecutive days

bigquery_notes: >
  Used in fct_payments as the main revenue event.
  Deduplicated by transaction_id.
  Joined with payment reconciliation exports for revenue quality checks.
  Daily volume drops greater than 15% vs the 7-day rolling average trigger a P0 review.
